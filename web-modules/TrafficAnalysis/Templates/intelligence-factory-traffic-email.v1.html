<!doctype html>
<html>
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{DOCUMENT_TITLE}}</title></head>
<body style="margin:0;background:#f3f5f8;font-family:Segoe UI,Arial,sans-serif;color:#182334;line-height:1.55">
<main style="max-width:760px;margin:28px auto;background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 12px 34px rgba(20,34,55,.12)">
<header style="padding:24px 32px 32px;background:#111d2f;color:#fff">
<img src="{{LOGO_DATA_URI}}" width="190" alt="Intelligence Factory" style="display:block;width:190px;max-width:55%;height:auto;margin:0 0 28px">
<p style="margin:0 0 10px;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#a9c4ef">{{REPORT_LABEL}} · {{TIMEFRAME}}</p>
<h1 style="margin:0 0 14px;font-size:30px;line-height:1.2;color:#fff">{{HEADLINE}}</h1>
<p style="margin:0;color:#d9e3f2;font-size:16px">{{EXECUTIVE_SUMMARY}}</p>
</header>
<section style="padding:28px 32px">
{{STATUS_OVERVIEW}}
<h2 style="margin:0 0 10px;font-size:21px;color:#182334">Recommended actions</h2>
{{ACTIONS}}
<h2 style="margin:30px 0 6px;font-size:21px;color:#182334">Source details</h2>
<p style="margin:0 0 16px;color:#64748b">Expand a source to see the metrics and evidence behind this report.</p>
{{SOURCE_DETAILS}}
<footer style="margin-top:28px;padding-top:18px;border-top:1px solid #dce3ec;color:#66758a;font-size:12px">{{FOOTER}}</footer>
</section>
</main>
</body>
</html>
