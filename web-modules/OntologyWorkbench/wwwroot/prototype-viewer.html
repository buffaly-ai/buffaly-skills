<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<title>Prototype Viewer · Ontology Workbench</title>
	<style>
		:root{--bg:#f8fafc;--panel:#fff;--border:#dadce0;--muted:#5f6368;--text:#202124;--blue:#1a73e8;--chip:#e8f0fe;--red:#d93025;font-family:Inter,Segoe UI,Arial,sans-serif;color:var(--text);background:var(--bg)}*{box-sizing:border-box}body{margin:0;background:var(--bg)}.shell{max-width:1180px;margin:0 auto;padding:28px 28px 60px}.viewer-status{margin:0 0 14px;color:var(--muted);font-size:14px}.viewer-status.error{color:var(--red);font-weight:700}.os-card{border:1px solid var(--border);border-radius:12px;background:var(--panel);overflow:hidden}.os-card.expanded{border-color:var(--blue);box-shadow:0 0 0 2px rgba(26,115,232,.18)}.os-card-head{display:flex;gap:13px;align-items:flex-start;width:100%;text-align:left;border:0;border-radius:0;background:transparent;color:var(--text);padding:16px 17px}.os-card-rank{flex:0 0 34px;height:34px;border-radius:999px;background:var(--chip);color:var(--blue);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px}.os-card-main{flex:1;min-width:0}.os-card-title{font-size:18px;font-weight:700;line-height:1.25}.os-card-proto{display:block;margin-top:3px;font-size:12px;color:var(--muted);word-break:break-all;font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.os-card-snippet{display:block;margin:7px 0 0;color:var(--text);font-size:14px}.os-card-meta{display:block;margin-top:7px;color:var(--muted);font-size:12px}.os-badges{display:flex;gap:5px;margin-top:7px}.os-badge{border-radius:999px;padding:3px 8px;font-size:11px;font-weight:800;background:#e6f4ea;color:#137333}.os-expand{font-size:18px;color:var(--blue)}.os-card-body{border-top:1px solid var(--border);padding:15px 17px 17px}.os-description{font-size:15px;line-height:1.45;margin:0 0 16px}.os-section{margin-top:18px}.os-section-head{display:flex;justify-content:space-between;align-items:center}.os-section-title,.os-semantic-title{font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.04em;color:#3c4043}.os-section-note{font-size:12px;color:var(--muted);margin:4px 0 8px}.os-prompt-content{max-height:560px;overflow:auto;margin:8px 0 0;padding:16px;border:1px solid var(--border);border-radius:12px;background:#f8fafc;color:var(--text);white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.55 ui-monospace,SFMono-Regular,Consolas,monospace}.os-semantic-row{display:flex;gap:7px;flex-wrap:wrap}.os-semantic-chip,.os-neighborhood-chip{border:1px solid #aecbfa;background:#f3f7ff;color:var(--blue);border-radius:999px;padding:5px 10px;font-size:12px;font-weight:700}.os-neighborhood{border:1px solid var(--border);border-radius:13px;background:#f8fafc;padding:14px;text-align:center}.os-neighborhood-label{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase}.os-neighborhood-current{display:inline-block;border:2px solid var(--blue);border-radius:999px;padding:4px 10px;color:var(--blue);font-weight:800;margin:7px}.decision-button{border:1px solid var(--border);border-radius:4px;padding:6px 12px;background:#fff;color:var(--text);font-size:12px;cursor:pointer}.os-props-toolbar{display:flex;gap:8px;align-items:center;margin:9px 0}.os-props-filter{flex:1;border:1px solid var(--border);border-radius:10px;padding:11px 12px;font:inherit;color:var(--text);background:var(--panel)}.os-props-count{font-size:12px;color:var(--muted);white-space:nowrap}.os-props-table{border:1px solid var(--border);border-radius:12px;overflow:hidden}.os-prop-row{display:grid;grid-template-columns:220px 1fr;border-top:1px solid var(--border)}.os-prop-row:first-child{border-top:0}.os-prop-name{padding:10px 13px;font-weight:800;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12px}.os-prop-value{padding:10px 13px;white-space:pre-wrap;overflow-wrap:anywhere}.os-prop-unset{color:var(--muted);font-style:italic}@media(max-width:850px){.shell{padding:18px}.os-prop-row{grid-template-columns:1fr}.os-prop-name{padding-bottom:0}}
	</style>
</head>
<body>
	<header data-ontology-workbench-header data-page="prototype-viewer"></header>
	<script src="/web-modules/OntologyWorkbench/ontology-workbench-header.js"></script>
	<script src="/js/kcs/buffaly-standalone-foundation.js?v=20260411.1"></script>
	<script src="/JsonWs/Buffaly.Agent.Host.BuffalyAgentService.ashx.js?v=20260826.1"></script>
	<main class="shell">
		<div id="viewerStatus" class="viewer-status" role="status" aria-live="polite">Loading prototype…</div>
		<article id="prototypeCard" class="os-card expanded" tabindex="-1">
			<div class="os-card-head">
				<span class="os-card-rank">1</span>
				<span class="os-card-main">
					<span id="prototypeTitle" class="os-card-title">Loading…</span>
					<span id="prototypeRef" class="os-card-proto"></span>
					<span class="os-card-snippet">Exact prototype from the attached session.</span>
					<span id="prototypeMeta" class="os-card-meta">Resolving loaded or indexed prototype…</span>
					<span class="os-badges"><span id="prototypeBadge" class="os-badge">Prototype</span></span>
				</span>
				<span class="os-expand">⌃</span>
			</div>
			<div class="os-card-body"><div id="prototypeDetails">Loading prototype details…</div></div>
		</article>
	</main>
	<script>
		(function () {
			"use strict";
			const byId = id => document.getElementById(id);
			const launchParams = new URLSearchParams(window.location.search || "");
			const sessionKey = (launchParams.get("sessionKey") || "").trim();
			const prototypeName = (launchParams.get("prototypeName") || "").trim();
			const requestController = new AbortController();

			function escapeHtml(value) {
				return String(value || "").replace(/[&<>"']/g, char => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;" })[char]);
			}

			function friendlyPrototype(value) {
				const leaf = String(value || "").split("#").pop().replace(/_/g, " ");
				return leaf.replace(/([a-z0-9])([A-Z])/g, "$1 $2");
			}

			function decodeTextResult(value) {
				const text = String(value || "");
				if (!text.startsWith("\"")) return text;
				try {
					const decoded = JSON.parse(text);
					return typeof decoded === "string" ? decoded : text;
				} catch {
					return text;
				}
			}

			function parsePrototypeDetails(text) {
				const value = decodeTextResult(text);
				const first = value.split(/\r?\n/)[0] || "";
				const type = (first.match(/:\s*\[([^\]]+)\]/) || [])[1] || "";
				const properties = [];
				for (const line of value.split(/\r?\n/).slice(1)) {
					const match = line.match(/^[\s├└│─]*([^=]+?)\s*=\s*"([\s\S]*)"(?:\s+\(-?\d+\))?:/);
					if (match) properties.push({ name: match[1].trim(), value: match[2].replace(/\\r\\n/g, "\n") });
				}
				return { type, properties, description: properties.find(x => x.name === "Description")?.value || "", aliases: (properties.find(x => x.name === "EntityName")?.value || "").split(",").map(x => x.trim()).filter(Boolean) };
			}

			function parseUnsetProperties(schemaText, assignedNames) {
				const unset = [];
				const assigned = new Set(assignedNames);
				for (const line of decodeTextResult(schemaText).split(/\r?\n/)) {
					const match = line.match(/^[\s├└│─]*([^:=]+?)\s*:\s*([^=]+?)(?:\s*=|\s*\(|$)/);
					if (!match) continue;
					const name = match[1].trim();
					if (name && !assigned.has(name) && !unset.some(row => row.name === name)) unset.push({ name, value: "Unset · " + match[2].trim(), unset: true });
				}
				return unset;
			}

			function renderOriginalDetails(body, prototype, detailsText, schemaText) {
				const data = parsePrototypeDetails(detailsText), assigned = data.properties.length, unset = parseUnsetProperties(schemaText, data.properties.map(x => x.name));
				body.replaceChildren();
				const description = document.createElement("p");
				description.className = "os-description";
				description.textContent = data.description || "No description is assigned.";
				body.appendChild(description);
				if (data.aliases.length) {
					const section = document.createElement("div");
					section.innerHTML = '<div class="os-semantic-title">Also known as</div><p class="os-section-note">Search aliases and alternate labels for this object.</p><div class="os-semantic-row">' + data.aliases.map(x => `<span class="os-semantic-chip">${escapeHtml(x)}</span>`).join("") + "</div>";
					body.appendChild(section);
				}
				const neighborhood = document.createElement("div");
				neighborhood.className = "os-section";
				neighborhood.innerHTML = `<div class="os-section-title">Neighborhood</div><p class="os-section-note">Local graph only: parent type and current node.</p><div class="os-neighborhood"><div><span class="os-neighborhood-chip">${escapeHtml(data.type || "Prototype")}</span></div><div class="os-neighborhood-label">is-a</div><div class="os-neighborhood-current">${escapeHtml(friendlyPrototype(prototype))}</div></div>`;
				body.appendChild(neighborhood);
				const props = document.createElement("div");
				props.className = "os-section";
				props.innerHTML = `<div class="os-section-head"><div class="os-section-title">Properties</div><button type="button" class="decision-button" data-show-unset>Show unset</button></div><p class="os-section-note">Prototype-valued fields render as links. Schema was loaded alongside details.</p><div class="os-props-toolbar"><input class="os-props-filter" type="search" placeholder="Filter properties"><span class="os-props-count">${assigned} set</span></div><div class="os-props-table"></div>`;
				const table = props.querySelector(".os-props-table"), filter = props.querySelector("input"), toggle = props.querySelector("[data-show-unset]");
				let showUnset = false;
				const draw = () => {
					const q = filter.value.toLowerCase();
					const rows = data.properties.concat(showUnset ? unset : []).filter(x => !q || x.name.toLowerCase().includes(q) || x.value.toLowerCase().includes(q));
					table.innerHTML = rows.map(x => `<div class="os-prop-row${x.unset ? " os-prop-unset" : ""}"><div class="os-prop-name">${escapeHtml(x.name)}</div><div class="os-prop-value">${escapeHtml(x.value)}</div></div>`).join("");
				};
				filter.addEventListener("input", draw);
				toggle.addEventListener("click", () => { showUnset = !showUnset; toggle.textContent = showUnset ? "Hide unset" : "Show unset"; draw(); });
				draw();
				body.appendChild(props);
				return data;
			}

			function isPromptAction(data) {
				return String(data && data.type || "").split(",").some(type => type.trim() === "PromptAction");
			}

			function renderPromptContent(body, promptText) {
				const section = document.createElement("section");
				section.className = "os-section";
				const title = document.createElement("div");
				title.className = "os-section-title";
				title.textContent = "Prompt instructions";
				const note = document.createElement("p");
				note.className = "os-section-note";
				note.textContent = "Resolved by executing this PromptAction in the already-loaded source session runtime.";
				const content = document.createElement("pre");
				content.className = "os-prompt-content";
				content.textContent = decodeTextResult(promptText);
				section.append(title, note, content);
				body.appendChild(section);
			}

			async function runInspectionAction(prototypeAction, args) {
				if (requestController.signal.aborted) throw new DOMException("The request was cancelled.", "AbortError");
				const deadline = Date.now() + 10000;
				while ((typeof BuffalyAgentService === "undefined" || typeof BuffalyAgentService.RunProtoScriptMethodAsync !== "function") && Date.now() < deadline) {
					await new Promise(resolve => setTimeout(resolve, 25));
					if (requestController.signal.aborted) throw new DOMException("The request was cancelled.", "AbortError");
				}
				if (typeof BuffalyAgentService === "undefined" || typeof BuffalyAgentService.RunProtoScriptMethodAsync !== "function") {
					throw new Error("BuffalyAgentService.RunProtoScriptMethodAsync did not become available.");
				}
				return await BuffalyAgentService.RunProtoScriptMethodAsync(sessionKey, "buffaly-agent", prototypeAction, "Execute", JSON.stringify(args));
			}

			async function loadPrototype() {
				if (!sessionKey) throw new Error("sessionKey is required.");
				if (!prototypeName) throw new Error("prototypeName is required.");
				byId("prototypeTitle").textContent = friendlyPrototype(prototypeName);
				byId("prototypeRef").textContent = prototypeName;
				const args = { prototype: prototypeName };
				const [details, schema] = await Promise.all([
					runInspectionAction("ToGetPrototypeDetails", args),
					runInspectionAction("ToGetPrototypePropertySchema", args)
				]);
				const data = renderOriginalDetails(byId("prototypeDetails"), prototypeName, details, schema);
				if (isPromptAction(data)) {
					const prompt = await runInspectionAction(prototypeName, {});
					if (requestController.signal.aborted) throw new DOMException("The request was cancelled.", "AbortError");
					renderPromptContent(byId("prototypeDetails"), prompt);
				}
				byId("prototypeMeta").textContent = "Exact prototype · " + (data.type || "Prototype");
				byId("prototypeBadge").textContent = data.type || "Prototype";
				byId("viewerStatus").textContent = "Loaded from session “" + sessionKey + "”.";
				document.title = friendlyPrototype(prototypeName) + " · Prototype Viewer";
				byId("prototypeCard").focus();
			}

			window.addEventListener("pagehide", () => requestController.abort(), { once: true });
			loadPrototype().catch(error => {
				if (error && error.name === "AbortError") return;
				byId("viewerStatus").textContent = error && error.message ? error.message : "Prototype could not be loaded.";
				byId("viewerStatus").className = "viewer-status error";
				byId("prototypeDetails").textContent = "Prototype details are unavailable.";
			});
		})();
	</script>
</body>
</html>
