<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ontology Critics</title>
<style>:root{font-family:Inter,Segoe UI,Arial,sans-serif;color:#202124;background:#f8fafc;--blue:#1a73e8;--border:#dadce0;--muted:#5f6368}*{box-sizing:border-box}body{margin:0}main{max-width:960px;margin:42px auto;padding:0 20px}h1{margin-bottom:8px}.intro{color:var(--muted);margin-bottom:25px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:20px}.card h2{margin:0}.agent{font:12px ui-monospace,Consolas,monospace;color:var(--muted);margin:5px 0 18px}.toggle{display:flex;align-items:center;gap:10px;font-weight:750;margin-bottom:18px}.fields{display:grid;gap:12px}label{display:grid;gap:5px;font-size:13px;color:var(--muted)}select{width:100%;padding:10px;border:1px solid var(--border);border-radius:8px;background:#fff;font:inherit;color:#202124}.sessions{color:var(--muted);font-size:13px;margin-top:15px}.actions{display:flex;gap:14px;align-items:center;margin-top:22px}.save{border:0;border-radius:8px;background:var(--blue);color:#fff;font-weight:800;padding:11px 18px;cursor:pointer}.save:disabled{opacity:.5}.status{color:var(--muted)}@media(max-width:720px){.grid{grid-template-columns:1fr}}</style></head>
<body><header data-ontology-workbench-header data-page="critics"></header><script src="/web-modules/OntologyWorkbench/ontology-workbench-header.js"></script>
<main><h1>Ontology critic settings</h1><p class="intro">Change persistent defaults and all existing critic sessions. Loaded critic workers are recycled so the new model is used on their next event; the protected web host is not restarted.</p><div id="grid" class="grid"></div><div class="actions"><button id="save" class="save" disabled>Save and refresh critics</button><span id="status" class="status">Loading settings...</span></div></main>
<script>const apiBase=location.pathname.startsWith('/harness/')?'/harness/api':'/web-modules/OntologyWorkbench/api',agents=[['MemoryCritic','Session memory critic'],['ActionCritic','Action critic']];let snapshot;
const value=(object,name)=>object?.[name]??object?.[name[0].toLowerCase()+name.slice(1)],escapeHtml=text=>String(text??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function request(method){const response=await fetch(apiBase+'/critic-settings',{method,headers:{'Content-Type':'application/json'},body:method==='PUT'?JSON.stringify({MemoryCritic:read('MemoryCritic'),ActionCritic:read('ActionCritic')}):undefined}),text=await response.text();if(!response.ok)throw new Error(text||response.statusText);return JSON.parse(text)}
function providers(){return value(value(snapshot,'Catalog'),'Providers')||[]}function models(provider){return value(providers().find(row=>value(row,'Provider')===provider),'Models')||[]}
function render(){document.getElementById('grid').innerHTML=agents.map(([key,title])=>{const row=value(snapshot,key),provider=value(row,'Provider'),model=value(row,'ModelName'),reason=value(row,'ReasoningLevel');return `<section class="card" data-key="${key}"><h2>${title}</h2><div class="agent">${escapeHtml(value(row,'AgentName'))}</div><label class="toggle"><input class="enabled" type="checkbox" ${value(row,'Enabled')?'checked':''}> Enabled for future events</label><div class="fields"><label>Provider<select class="provider">${providers().filter(p=>value(p,'IsEnabled')).map(p=>`<option ${value(p,'Provider')===provider?'selected':''}>${escapeHtml(value(p,'Provider'))}</option>`).join('')}</select></label><label>Model<select class="model"></select></label><label>Reasoning<select class="reason"></select></label></div><div class="sessions">${value(row,'ExistingSessionCount')} existing sessions; ${value(row,'LoadedSessionCount')} loaded</div><input class="agentName" type="hidden" value="${escapeHtml(value(row,'AgentName'))}"></section>`}).join('');document.querySelectorAll('.card').forEach(card=>{const key=card.dataset.key,row=value(snapshot,key);card.querySelector('.provider').onchange=()=>fill(card);fill(card,value(row,'ModelName'),value(row,'ReasoningLevel'))});document.getElementById('save').disabled=false}
function fill(card,selectedModel,selectedReason){const rows=models(card.querySelector('.provider').value),model=selectedModel&&rows.some(r=>value(r,'ModelName')===selectedModel)?selectedModel:value(rows.find(r=>value(r,'IsDefault'))||rows[0],'ModelName');card.querySelector('.model').innerHTML=rows.map(r=>`<option ${value(r,'ModelName')===model?'selected':''}>${escapeHtml(value(r,'ModelName'))}</option>`).join('');const row=rows.find(r=>value(r,'ModelName')===model)||{},reasons=value(row,'SupportedReasoningLevels')||[];card.querySelector('.model').onchange=()=>fill(card,card.querySelector('.model').value);const reason=selectedReason&&reasons.includes(selectedReason)?selectedReason:value(row,'DefaultReasoningLevel');card.querySelector('.reason').innerHTML=reasons.map(r=>`<option ${r===reason?'selected':''}>${escapeHtml(r)}</option>`).join('')}
function read(key){const card=document.querySelector(`[data-key="${key}"]`);return{AgentName:card.querySelector('.agentName').value,Enabled:card.querySelector('.enabled').checked,Provider:card.querySelector('.provider').value,ModelName:card.querySelector('.model').value,ReasoningLevel:card.querySelector('.reason').value}}
async function load(){try{snapshot=await request('GET');render();document.getElementById('status').textContent='Settings loaded.'}catch(error){document.getElementById('status').textContent=error.message}}
document.getElementById('save').onclick=async()=>{const button=document.getElementById('save');button.disabled=true;document.getElementById('status').textContent='Saving profiles, updating sessions, and recycling loaded critic workers...';try{snapshot=await request('PUT');render();document.getElementById('status').textContent=`Saved. Updated ${value(snapshot,'UpdatedSessionCount')} sessions and recycled ${value(snapshot,'RecycledWorkerCount')} loaded workers.`}catch(error){document.getElementById('status').textContent=error.message}finally{button.disabled=false}};load();</script></body></html>
