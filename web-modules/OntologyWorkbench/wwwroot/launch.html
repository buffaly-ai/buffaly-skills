<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Opening Ontology Workbench</title></head>
<body><p>Opening Ontology Workbench...</p><script>
(function(){
  const modeKey='OntologyWorkbench.LaunchMode';
  const baseUrlKey='OntologyWorkbench.StandaloneBaseUrl';
  const mode=localStorage.getItem(modeKey)||'standalone';
  const base=(localStorage.getItem(baseUrlKey)||'https://win.tailf78e41.ts.net:5320').replace(/\/$/,'');
  const query=new URLSearchParams(location.search);
  const viewer=!!query.get('prototypeName');
  const target=mode==='web-module'
    ?new URL(viewer?'/web-modules/OntologyWorkbench/prototype-viewer':'/web-modules/OntologyWorkbench/workbench',location.origin)
    :new URL(base+(viewer?'/harness/prototype-viewer':'/harness/'));
  query.forEach((value,key)=>target.searchParams.set(key,value));
  if(mode==='standalone')target.searchParams.set('launchSettingsUrl',new URL('/web-modules/OntologyWorkbench/settings.html',location.origin).toString());
  location.replace(target.toString());
}());
</script></body></html>
