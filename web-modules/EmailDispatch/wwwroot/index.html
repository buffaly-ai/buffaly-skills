<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Email Dispatch</title><link rel="stylesheet" href="/css/bootstrap.min.css"><script src="/js/kcs/buffaly-standalone-foundation.js"></script><script src="/JsonWs/Buffaly.EmailDispatch.EmailObservations.ashx.js"></script><script src="/JsonWs/Buffaly.EmailDispatch.EmailWorks.ashx.js"></script><script src="/JsonWs/Buffaly.EmailDispatch.EmailSyncAccounts.ashx.js"></script><script defer src="/js/email-dispatch.js"></script></head>
<body><main class="container py-4 text-break"><h1>Email Dispatch</h1><p id="status" role="status" aria-live="polite">Loading the saved program…</p>
<details open><summary class="h2">Gmail synchronization</summary><section id="accounts" class="py-3"></section></details>
<details open><summary class="h2">Intake program</summary><section id="program" class="py-3"></section><button id="edit-policy-root" type="button" class="btn btn-secondary">Edit rule hierarchy</button><form id="add-rule-form" class="py-3"><label for="new-rule-name" class="form-label">New rule name</label><input id="new-rule-name" class="form-control" required maxlength="255"><button id="add-rule" type="submit" class="btn btn-secondary mt-2">Add disabled top-level rule</button></form></details>
<section id="editor" class="py-3" hidden><h2 id="editor-title">Edit rule</h2><form id="source-form"><label class="form-label" for="source">Authoritative ProtoScript declaration</label><textarea class="form-control font-monospace" id="source" rows="24" spellcheck="false"></textarea><div class="py-3"><button id="save" type="submit" class="btn btn-primary">Save rule</button> <button id="cancel" type="button" class="btn btn-secondary">Cancel</button></div></form></section>
<details id="tree-panel"><summary class="h2">Shared client and work tree</summary>
<form id="tree-search-form" class="py-3"><label class="form-label" for="tree-search">Find client, work, context or destination</label><input id="tree-search" type="search" class="form-control"><button class="btn btn-primary mt-2" type="submit">Search tree</button> <button id="tree-back" class="btn btn-secondary mt-2" type="button">Back</button></form>
<nav id="tree-path" aria-label="Tree location"></nav><nav id="tree-recent" aria-label="Recently viewed"></nav><section id="tree-results"></section><button id="tree-more" class="btn btn-secondary my-2" type="button">Next tree page</button>
<section id="tree-editor" class="py-3" hidden><h2 id="tree-title"></h2><form id="tree-context-form"><label for="tree-name" class="form-label">Name</label><input id="tree-name" class="form-control"><label for="tree-context" class="form-label mt-2">Routing context and selected agent instruction</label><textarea id="tree-context" class="form-control" rows="8"></textarea><button id="tree-save" class="btn btn-primary mt-2" type="submit">Save context</button></form>
<p id="tree-destination"></p><form id="destination-search-form" class="py-3"><label for="destination-search" class="form-label">Find a work session</label><input id="destination-search" type="search" class="form-control"><button class="btn btn-secondary mt-2" type="submit">Find sessions</button> <button id="destination-clear" class="btn btn-secondary mt-2" type="button">Clear work session</button></form><section id="destination-results"></section></section></details>
<details open><summary class="h2">Email review</summary><section id="outcomes" class="py-3"></section><button id="process" type="button" class="btn btn-secondary">Classify synchronized emails — no delivery</button><form id="search-form" class="py-3"><label class="form-label" for="search">Find captured emails</label><input class="form-control" id="search" type="search"><button type="submit" class="btn btn-primary mt-2">Search</button></form><section id="inbox"></section><button id="more" class="btn btn-secondary my-3" hidden>Next page</button></details>
<section id="email" class="py-3" hidden><h2 id="subject"></h2><p id="sender"></p><pre id="body" class="text-wrap"></pre><button id="test" class="btn btn-primary">Test saved policy — no effects</button><p id="test-result" role="status"></p><section id="works"></section></section>
</main></body></html>
