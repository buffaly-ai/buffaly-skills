<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Conversations · Email Dispatch</title>
<link rel="stylesheet" href="/css/bootstrap.min.css?v=0.2.0"><link rel="stylesheet" href="/css/icons.min.css?v=0.2.0"><link rel="stylesheet" href="/css/email-dispatch.css?v=0.2.7">
<script src="/js/kcs/buffaly-standalone-foundation.js?v=0.2.0"></script><script src="/js/kcs/grid4.js?v=0.2.0"></script>
<script src="/JsonWs/Buffaly.EmailDispatch.EmailObservations.ashx.js?v=0.2.6"></script>
<script defer src="/js/email-dispatch-ui.js?v=0.2.9"></script><script defer src="/js/email-conversations.js?v=0.1.1"></script>
</head>
<body>
<a class="ed-skip" href="#main">Skip to content</a>
<header class="ed-header"><div class="ed-shell ed-header-inner"><a class="ed-brand" href="/#inbox">Email Dispatch</a><nav class="ed-nav" aria-label="Main"><a href="/#inbox">Review</a><a href="/conversations.html" aria-current="page">Conversations</a><a href="/#rules">Rules</a><a href="/#accounts">Accounts</a></nav><span class="ed-account">matt@intelligencefactory.ai</span></div></header>
<main class="ed-shell" id="main">
<div id="status" class="ed-message" role="status" aria-live="polite" hidden></div>
<section id="view-conversations" class="ed-view">
<div class="ed-heading"><h1 tabindex="-1">Conversations</h1></div>
<form id="conversation-search-form" class="ed-search"><label class="visually-hidden" for="conversation-search">Search conversations</label><input id="conversation-search" class="form-control" type="search" placeholder="Search sender or subject"><button class="btn btn-primary" type="submit"><i class="fas fa-search" aria-hidden="true"></i>Search</button></form>
<div id="conversations" class="ed-grid-host" aria-busy="true"><p class="ed-empty">Loading conversations…</p></div><div id="conversation-pager" class="ed-pager" aria-label="Conversation pages"></div>
</section>
<section id="view-conversation" class="ed-view" hidden><div class="ed-message-tools"><a class="ed-back" href="#conversations">Back to conversations</a></div><div class="ed-heading"><h1 id="thread-subject" tabindex="-1"></h1><div id="thread-status"></div></div>
<div id="thread-messages" class="ed-grid-host"></div><div id="thread-pager" class="ed-pager" aria-label="Message pages"></div>
</section>
<section id="view-message" class="ed-view" hidden><div class="ed-message-tools"><a id="back-thread" class="ed-back" href="#conversations">Back to conversation</a><a id="review-dispatch" href="/#inbox" hidden>Review dispatch</a></div><article class="ed-reading-surface"><h1 id="message-subject" class="ed-subject" tabindex="-1"></h1><div id="message-facts"></div><div id="message-loading" class="ed-result" role="status"></div><iframe id="message-html" class="ed-email-frame" title="Formatted email" sandbox="allow-scripts allow-popups allow-popups-to-escape-sandbox" referrerpolicy="no-referrer" hidden></iframe><div id="message-text" class="ed-email-body"></div></article></section>
</main>
</body></html>
