<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Google Ads OAuth Callback</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f8fafc;color:#0f172a;margin:0;padding:2rem}
    main{max-width:760px;margin:0 auto;background:#fff;border:1px solid #e2e8f0;border-radius:18px;padding:1.5rem;box-shadow:0 18px 40px rgba(15,23,42,.08)}
    .status{border-radius:12px;padding:1rem;background:#eef2ff;color:#312e81;font-weight:700}.status.error{background:#fee2e2;color:#991b1b}.status.ok{background:#dcfce7;color:#166534}
    pre{white-space:pre-wrap;background:#0f172a;color:#dbeafe;border-radius:12px;padding:1rem;overflow:auto}a{color:#2563eb;font-weight:700}
  </style>
</head>
<body>
<main>
  <h1>Google Ads OAuth Callback</h1>
  <p id="message" class="status">Completing Google Ads authorization…</p>
  <pre id="details"></pre>
  <p><a href="/web-modules/GoogleAds/index.html">Return to Google Ads module</a></p>
</main>
<script>
(function () {
  'use strict';
  var message = document.getElementById('message');
  var details = document.getElementById('details');
  function setResult(kind, text, payload) {
    message.className = 'status ' + kind;
    message.textContent = text;
    details.textContent = payload ? JSON.stringify(payload, null, 2) : '';
  }
  var query = new URLSearchParams(location.search);
  var error = query.get('error');
  if (error) {
    setResult('error', 'Google authorization was not completed.', { Error: error, ErrorDescription: query.get('error_description') || '' });
    return;
  }
  var code = query.get('code');
  var state = query.get('state');
  if (!code || !state) {
    setResult('error', 'OAuth callback is missing code or state.', { HasCode: !!code, HasState: !!state });
    return;
  }
  fetch('/api/buffaly.googleads/google-ads-service/complete-authorization', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ Code: code, State: state })
  }).then(function (response) {
    return response.json().then(function (json) { return { ok: response.ok, json: json }; });
  }).then(function (result) {
    if (!result.ok || !result.json || result.json.Ok === false) {
      setResult('error', 'Google Ads authorization failed.', result.json || { Ok: false });
      return;
    }
    setResult('ok', 'Google Ads authorization completed.', { Ok: true, OAuthEmail: result.json.OAuthEmail || null });
    window.setTimeout(function () { location.href = '/web-modules/GoogleAds/index.html'; }, 2500);
  }).catch(function (err) {
    setResult('error', 'Google Ads authorization request failed.', { Message: err.message });
  });
}());
</script>
</body>
</html>
