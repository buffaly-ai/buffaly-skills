<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{CLIENT_NAME}} - Website Growth Proposal</title>
<style>
@font-face{font-family:Glancyr;src:url('assets/fonts/Glancyr-Regular.otf') format('opentype');font-weight:400}
@font-face{font-family:Glancyr;src:url('assets/fonts/Glancyr-Medium.otf') format('opentype');font-weight:500}
@font-face{font-family:Glancyr;src:url('assets/fonts/Glancyr-SemiBold.otf') format('opentype');font-weight:700}
:root{--ink:#0E1524;--ivory:#F7F5F0;--paper:#fff;--teal:#0E6F78;--aqua:#72D0C6;--green:#12664F;--orange:#FF8A2A;--slate:#55647A;--line:#E4E1D9;--blue:#102A43}
*{box-sizing:border-box}html,body{margin:0;padding:0;background:#0A1020;overflow:hidden;font-family:Glancyr,Segoe UI,Arial,sans-serif;color:var(--ink)}#stage{width:1280px;height:720px;position:absolute;transform-origin:top left;overflow:hidden;background:var(--ivory)}.slide{position:absolute;inset:0;width:1280px;height:720px;overflow:hidden;display:none;background:var(--ivory)}.slide.is-active{display:block}.dark{background:var(--ink);color:#fff}.pad{position:absolute;left:64px;top:46px;right:64px}.eyebrow{font-size:14px;font-weight:700;letter-spacing:2.6px;text-transform:uppercase;color:var(--teal)}.dark .eyebrow{color:#9BE4DA}h1{font-size:48px;line-height:1.05;letter-spacing:-1.2px;font-weight:700;margin:14px 0 0;max-width:1010px}h2{font-size:26px;line-height:1.13;margin:0;font-weight:700}h3{font-size:19px;line-height:1.18;margin:0 0 8px;font-weight:700}p{margin:0}.lead{font-size:21px;line-height:1.38;color:var(--slate);max-width:900px;margin-top:14px}.dark .lead{color:#C3CCDA}.body{font-size:16.5px;line-height:1.42;color:var(--slate)}.dark .body{color:#B9C4D4}.tiny{font-size:14.5px;line-height:1.4;color:#6B7A8E}.rule{height:5px;width:78px;border-radius:4px;background:var(--orange);margin:22px 0}.photo{position:absolute;inset:0;background-size:cover;background-position:center}.scrim-l{position:absolute;inset:0;background:linear-gradient(96deg,#0B1220 0%,#0B1220F7 40%,#0B1220DB 56%,#0B12203D 78%,#0B122000 100%)}.scrim-b{position:absolute;left:0;right:0;bottom:0;height:130px;background:linear-gradient(0deg,#0B1220E6,#0B122000)}.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:22px 24px}.dark .card{background:#FFFFFF10;border-color:#FFFFFF22;color:#fff}.card .body{color:inherit;opacity:.78}.tag{display:inline-block;font-size:12.5px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;padding:5px 10px;border-radius:6px;background:#DDEEF3;color:#0E5468}.tag.o{background:#FFEEDC;color:#9A4A00}.tag.g{background:#DCEEE5;color:#12664F}.dark .tag{background:#FFFFFF1A;color:#DDF9F5}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:28px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.shot{position:relative;overflow:hidden;border-radius:14px;background:#fff;box-shadow:0 16px 38px #0E152430;border:1px solid #DFDCD4}.shot img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}.phone img{object-fit:contain;background:#fff}.gate{border-radius:12px;padding:14px 20px;background:#FFF6EC;border-left:5px solid var(--orange);font-size:15.5px;line-height:1.4;color:#5A4632}.dark .gate{background:#FFFFFF12;border-left-color:var(--orange);color:#D8CFC4}.metric{font-size:54px;line-height:.95;font-weight:700;letter-spacing:-1.8px;color:var(--teal)}.dark .metric{color:#9BE4DA}.stripe{position:absolute;right:-180px;top:-120px;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,rgba(114,208,198,.34),rgba(114,208,198,0) 65%)}.bottom{position:absolute;left:64px;right:64px;bottom:26px;display:flex;align-items:center;gap:20px}.brand{height:19px;width:auto;opacity:.9}.rail{display:flex;gap:4px;flex:1}.rail i{display:block;width:15px;height:4px;border-radius:2px;background:#CFCCC3}.rail i.on{background:var(--teal)}.rail i.now{background:var(--orange);width:24px}.dark .rail i{background:#3A465C}.pageno{font-size:13px;font-weight:700;letter-spacing:1.4px;color:#8A94A3}.chip{position:absolute;right:64px;top:48px;z-index:6;font-size:12.5px;font-weight:700;letter-spacing:2.2px;text-transform:uppercase;padding:7px 14px;border-radius:99px;background:#DDEEF3;color:#0E5468}.dark .chip{background:#FFFFFF1F;color:#E4FDF9}.flow{display:flex;align-items:stretch}.fstep{flex:1;padding:16px 14px;background:#fff;border:1px solid var(--line);border-right:0}.fstep:first-child{border-radius:12px 0 0 12px}.fstep:last-child{border-right:1px solid var(--line);border-radius:0 12px 12px 0}.fstep b{font-size:18px}.fstep span{display:block;font-size:13.5px;line-height:1.3;color:var(--slate);margin-top:6px}#nav{position:fixed;right:20px;bottom:20px;z-index:60;display:flex;align-items:center;gap:10px}#nav button{width:50px;height:50px;border-radius:50%;border:1px solid #FFFFFF44;background:#141C2Ee6;color:#fff;font-size:22px;font-weight:700;cursor:pointer;box-shadow:0 8px 24px #0007}#navcount{color:#fff;font-size:13px;font-weight:700;letter-spacing:1.5px;background:#141C2Ee6;border:1px solid #FFFFFF33;border-radius:99px;padding:9px 14px}@page{size:1280px 720px;margin:0}@media print{#nav{display:none}html,body{overflow:visible;background:#fff;width:1280px;height:auto}#stage{position:static;transform:none!important;width:1280px;height:auto;overflow:visible}.slide{display:block;position:relative;page-break-after:always;break-after:page}}
</style></head><body><div id="stage">
{{SLIDES_HTML_EXACTLY_16}}
</div><div id="nav"><button id="prev" aria-label="Previous">&lsaquo;</button><span id="navcount">1 / 16</span><button id="next" aria-label="Next">&rsaquo;</button></div><script>(()=>{const slides=[...document.querySelectorAll('.slide')],count=document.getElementById('navcount'),prev=document.getElementById('prev'),next=document.getElementById('next'),stage=document.getElementById('stage');let cur=0;function fit(){const s=Math.min(innerWidth/1280,innerHeight/720);stage.style.transform=`scale(${s})`;stage.style.left=((innerWidth-1280*s)/2)+'px';stage.style.top=((innerHeight-720*s)/2)+'px'}function rail(i){let r='<div class="bottom"><img class="brand" src="assets/if-logo-light-bg.png"><div class="rail">';for(let x=0;x<slides.length;x++){r+='<i class="'+(x<i?'on ':x===i?'now ':'')+'"></i>'}r+='</div><div class="pageno">'+(i+1)+' / '+slides.length+'</div></div>';return r}function show(i){cur=Math.max(0,Math.min(slides.length-1,i));slides.forEach((s,idx)=>{s.classList.toggle('is-active',idx===cur);let old=s.querySelector('.bottom');if(old)old.remove();s.insertAdjacentHTML('beforeend',rail(idx));});count.textContent=(cur+1)+' / '+slides.length;prev.disabled=cur===0;next.disabled=cur===slides.length-1}prev.onclick=()=>show(cur-1);next.onclick=()=>show(cur+1);addEventListener('keydown',e=>{if(e.key==='ArrowRight')show(cur+1);if(e.key==='ArrowLeft')show(cur-1)});addEventListener('resize',fit);fit();show(0)})();</script></body></html>
